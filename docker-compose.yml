services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantic}
      POSTGRES_USER: ${POSTGRES_USER:-quantic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantic_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-quantic}
      POSTGRES_USER: ${POSTGRES_USER:-quantic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantic_dev_password}
      MAX_GUESTS_PER_SLOT: ${MAX_GUESTS_PER_SLOT:-20}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
