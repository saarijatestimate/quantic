<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservations | Cafe Fausse</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner">
        <a class="brand" href="/index.html">Cafe Fausse</a>
        <div class="nav-links">
          <a href="/menu.html">Menu</a>
          <a href="/reservations.html">Reservations</a>
          <a href="/about.html">About Us</a>
          <a href="/gallery.html">Gallery</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <h1>Reservations</h1>
      <p>Reserve your table for an intimate dinner or special celebration.</p>

      <form class="form">
        <div class="form-row">
          <div class="col-grow">
            <label for="datetime">Time Slot</label>
            <input id="datetime" class="input" type="datetime-local" />
          </div>

          <div class="col-fixed">
            <label for="guests">Guests</label>
            <input id="guests" class="input" type="number" min="1" max="12" value="2" />
          </div>
        </div>

        <div class="form-row">
          <div class="col-grow main-column">
            <label for="name">Customer Name</label>
            <input id="name" class="input" type="text" placeholder="Enter your name" />
          </div>

          <div class="col-grow">
            <label for="email">Email Address</label>
            <input id="email" class="input" type="email" placeholder="Enter your email" />
          </div>
        </div>

        <div>
          <label for="phone">Phone Number (optional)</label>
          <input id="phone" class="input" type="tel" placeholder="Enter your phone number" />
        </div>

        <div>
          <button type="submit" class="btn">Submit Reservation</button>
        </div>
      </form>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('form');
        const status = document.createElement('p');
        status.style.marginTop = '12px';
        status.style.color = '#2f2a24';
        form.appendChild(status);

        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const payload = {
            customer_name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            reservation_time: document.getElementById('datetime').value,
            number_of_guests: Number(document.getElementById('guests').value),
            notes: ''
          };

          if (!payload.customer_name || !payload.email || !payload.reservation_time) {
            status.textContent = 'Please complete your name, email, and reservation time.';
            return;
          }

          status.textContent = 'Submitting...';

          try {
            const response = await fetch('http://localhost:4000/reservations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.error || 'Unable to save reservation.');
            }

            status.textContent = 'Reservation saved successfully!';
            form.reset();
            document.getElementById('guests').value = '2';
          } catch (error) {
            status.textContent = error.message;
          }
        });
      });
    </script>
  </body>
</html>
